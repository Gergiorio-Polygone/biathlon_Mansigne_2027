<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Biathlon – Pénalités</title>
<style>
:root{--bg:#f4f1ec;--fg:#1c1c1c;--card:#fff;--line:#d8d2c8;--acc:#1d4ed8;--bad:#c62828;--ok:#2e7d32}
@media(prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#f2f2f2;--card:#23262c;--line:#3a3e46;--acc:#7aa2ff;--bad:#ff6b6b;--ok:#6fcf73}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.3 system-ui,sans-serif}
header{background:var(--acc);color:#fff;padding:6px 8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
header select,header button{font:inherit;font-size:clamp(12px,3.6vw,15px);padding:6px 8px;border-radius:8px;border:0}
header .m{display:flex;gap:6px}
header .m button,#fs,#me{background:rgba(255,255,255,.25);color:#fff}
header .m button.on{background:#fff;color:var(--acc);font-weight:700}
#st{margin-left:auto;font-size:13px}
main{padding:8px 6px 100px}
h3{margin:12px 0 6px}
.note{opacity:.8;font-size:14px;margin:4px 0 8px}
.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.seg button{flex:1 0 18%;min-width:0;padding:10px 0;font:inherit;font-size:clamp(11px,3.4vw,15px);white-space:nowrap;font-weight:600;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--fg)}
.seg button.on{background:var(--fg);color:var(--bg)}
.hdr,.row{display:grid;grid-template-columns:clamp(22px,7vw,34px) repeat(4,minmax(0,1fr));gap:4px;margin-bottom:6px;align-items:stretch}
.hdr b{padding:5px 0;text-align:center;border-radius:8px;font-size:clamp(9px,3vw,13px);overflow:hidden;min-width:0}
.tn{display:flex;align-items:center;justify-content:center;font-size:clamp(14px,5vw,20px);font-weight:700}
.cell{height:clamp(44px,14vw,76px);min-width:0;padding:0;font-size:clamp(20px,8vw,32px);font-weight:700;border-radius:12px;border:4px solid;background:var(--card);color:var(--fg)}
.cell.bad{background:var(--bad);color:#fff}
.pr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.pr .dot{width:18px;height:18px;border-radius:50%;flex:none}
.pr .i{flex:1}.pr .i small{display:block;opacity:.75}
.pr button{font:inherit;font-weight:700;border-radius:10px;border:0;padding:14px 12px;background:var(--acc);color:#fff;min-width:84px}
.pr button.u{background:var(--line);color:var(--fg);min-width:48px}
.pr.done{opacity:.5}.pr.err{border-color:var(--bad);border-width:2px}
.tag{font-weight:700}.err .tag{color:var(--bad)}
table{width:100%;border-collapse:collapse;background:var(--card);font-size:15px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
.wrap{overflow-x:auto}.bad{color:var(--bad);font-weight:700}
.miss{background:var(--bad);color:#fff;font-weight:700}.extra{background:#f0a020;color:#000;font-weight:700}.ok{color:var(--ok);font-weight:700}
.btn{display:block;width:100%;margin-top:12px;padding:14px;font:inherit;font-weight:700;border-radius:10px;border:0;background:var(--acc);color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;min-width:0;padding:8px 2px;line-height:1.25;font:inherit;font-size:clamp(10px,3.2vw,14px);white-space:nowrap;font-weight:600;border:0;background:none;color:var(--fg)}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:10}
#sheet.open{display:flex}
#sheet>div{max-height:92vh;overflow:auto;background:var(--card);width:100%;padding:16px 16px 28px;border-radius:18px 18px 0 0}
#sheet h3{margin:0 0 12px;font-size:clamp(15px,4.6vw,20px)}
.num{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.num button{height:clamp(60px,17vw,76px);min-width:0;padding:0;font:inherit;font-size:clamp(26px,9vw,36px);font-weight:700;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
.num button.sm{height:clamp(48px,13vw,60px);font-size:clamp(14px,4.2vw,18px)}
.num button.cur{border-color:var(--acc);background:var(--acc);color:#fff}
.msg{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--ok);border-radius:12px;padding:8px 10px;margin-bottom:8px;font-weight:700;min-height:56px;font-size:clamp(12px,3.4vw,15px)}
.msg.w{border-color:#e08a00}.msg span{flex:1}.msg button{font:inherit;font-weight:700;padding:12px 14px;border-radius:10px;border:0;background:var(--line);color:var(--fg)}.msg button:disabled{opacity:.35}
.pad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pad button{height:clamp(44px,12vw,58px);min-width:0;padding:0;font:inherit;font-size:clamp(16px,6vw,26px);font-weight:700;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--fg);position:relative}
.pad button.todo{border-color:var(--bad)}.pad button.sel{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pad i{position:absolute;top:1px;right:5px;font-size:12px;font-style:normal;font-weight:700;color:var(--bad)}
.pad button.sel i{color:var(--bg)}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.cols button{height:clamp(64px,22vw,96px);min-width:0;padding:0;overflow:hidden;border:0;border-radius:12px;font:inherit;font-weight:700;font-size:clamp(10px,3.2vw,17px)}.cols button:disabled{opacity:.3}
.pr>.tag{font-size:clamp(12px,3.6vw,15px);text-align:right}
.gt{table-layout:fixed}.gt th,.gt td{padding:5px 0;font-size:clamp(11px,3.4vw,14px)}
.gt th:first-child,.gt td:first-child{width:11%}.gt .sep{border-left:2px solid var(--line)}
.crl2{display:flex;align-items:center;gap:8px;margin:6px 0}.crl2 span{flex:0 0 38%;font-size:clamp(12px,3.6vw,15px)}.crl2 input{padding:8px 10px;min-width:0}
.err{color:var(--bad);font-weight:700;margin:6px 0 0}input.inerr{border-color:var(--bad)}
.empty{text-align:center;opacity:.7;padding:30px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.role{display:flex;flex-direction:column;gap:8px}
.role button{padding:16px 10px;font:inherit;font-size:clamp(13px,4vw,17px);font-weight:700;text-align:left;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg)}
.role button.on{border-color:var(--acc);background:var(--acc);color:#fff}
input{font:inherit;width:100%;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--fg)}
.stp{display:flex;gap:8px;margin:8px 0}
.stp button{width:56px;font:inherit;font-size:26px;font-weight:700;border-radius:10px;border:0;background:var(--acc);color:#fff}
.stp input{text-align:center;font-size:24px;font-weight:700}
.crl{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
</style></head>
<body>
<header>
  <select id="serie" onchange="chSerie(this.value)"></select>
  <span class="m"><button data-m="ms" onclick="chManche('ms')">Mass Start</button> <button data-m="po" onclick="chManche('po')">Poursuite</button></span>
  <button id="me" onclick="roleScreen()">👤</button> <button id="fs" onclick="fs()">⛶</button> <span id="st" onclick="cfg()">⚙</span>
</header>
<main id="main"></main>
<nav></nav>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div></div></div>

<script>
// Adresse de la base Firebase (mémorisée ensuite sur chaque appareil). Ex. : https://mon-projet-default-rtdb.europe-west1.firebasedatabase.app
const DEFAULT_DB = 'https://biathlon-mansigne-default-rtdb.europe-west1.firebasedatabase.app';

const C=[['r','Rouge','#e5534b','#fff'],['v','Vert','#43a047','#fff'],['j','Jaune','#f9d71c','#222'],['b','Bleu','#2b9fd9','#fff']];
const MN={ms:'Mass Start',po:'Poursuite'};
const TABS={tir:[['tir','🎯','Tir'],['rec','📋','Récap']],pen:[['pen','🏃','Pénalités'],['rec','📋','Récap']],
  org:[['tir','🎯','Tir'],['pen','🏃','Pénalités'],['rec','📋','Récap'],['cfg','⚙️','Série']]};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let DB=(ls.get('db',DEFAULT_DB)||'').replace(/\/+$/,'');if(DB)ls.set('db',DB);
let serie=ls.get('serie','1'), manche=ls.get('manche','ms'), me=ls.get('me',null), poste=me?me.poste:0, tab='tir';
let data=ls.get('data_'+serie,{}), pending=ls.get('pend_'+serie,{}), status=DB?'off':'local';
let cur=null, selT=null, msg='', hist=[], showRole=true, rs={role:me?me.role:'tir',poste:me?me.poste:0,name:me?me.name:'',err:''};

const key=(m,t,c,f)=>m+'/'+t+'-'+c+'/'+f;
const val=(m,t,c,f)=>data[key(m,t,c,f)];
const nb=()=>Math.max(1,Math.min(60,parseInt(data['cfg/nb'])||20));
const np=()=>Math.ceil(nb()/5);
const tr=p=>[p*5+1,Math.min(nb(),p*5+5)];
const lab=p=>{const r=tr(p);return r[0]===r[1]?''+r[0]:r[0]+'–'+r[1]};
const ctl=p=>data['ctrl/'+p]||'';
function persist(){ls.set('data_'+serie,data);ls.set('pend_'+serie,pending)}

async function push(k){
  if(!DB)return;
  try{const r=await fetch(DB+'/s'+serie+'/'+k+'.json',{method:'PUT',body:JSON.stringify(data[k])});
      if(!r.ok)throw 0;delete pending[k];status='ok'}catch(e){status='off'}
  persist();head();
}
function set(k,v){data[k]=v;pending[k]=1;persist();push(k);render()}
async function pull(){
  if(!DB)return;const s=serie;
  try{
    const r=await fetch(DB+'/s'+s+'.json');if(!r.ok)throw 0;
    const j=(await r.json())||{};if(s!==serie)return;
    const nd={};
    for(const m in j){
      if(m==='cfg'||m==='ctrl'){for(const f in j[m])nd[m+'/'+f]=j[m][f];continue}
      for(const tc in j[m])for(const f in j[m][tc])nd[m+'/'+tc+'/'+f]=j[m][tc][f];
    }
    for(const k in pending)nd[k]=data[k];
    data=nd;status='ok';persist();
    for(const k in pending)push(k);
  }catch(e){status='off'}
  head();
  if(showRole){}
  else if(!$('#sheet').classList.contains('open')&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))render();
}

function head(){
  $('#st').textContent=status==='ok'?'🟢 Synchro':status==='off'?'🔴 Hors ligne ⚙':'⚪ Local ⚙';
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===manche));
}
function fs(){try{const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen).call(d)}catch(e){}}
if(matchMedia('(display-mode: standalone)').matches)$('#fs').style.display='none';
function cfg(){
  const u=prompt('Adresse de la base Firebase (laisser vide = mode local, sans synchronisation) :',DB);
  if(u===null)return;
  DB=u.trim().replace(/\/+$/,'');ls.set('db',DB);status=DB?'off':'local';head();pull();
}
function chSerie(v){keepNm();serie=v;$('#serie').value=v;ls.set('serie',v);data=ls.get('data_'+v,{});pending=ls.get('pend_'+v,{});hist=[];msg='';selT=null;render();pull()}
function chManche(m){manche=m;ls.set('manche',m);selT=null;render()}
function chTab(t){tab=t;render()}
function setPoste(p){poste=p;render()}

/* ---------- Choix du rôle ---------- */
const norm=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
function keepNm(){const e=$('#nm');if(e)rs.name=e.value}
function rsRole(r){keepNm();rs.role=r;rs.err='';render()}
function roleScreen(){showRole=true;rs={role:me?me.role:'tir',poste:0,name:me?me.name:'',err:''};render()}
function anyAssigned(){for(let p=0;p<np();p++)if(ctl('p'+p))return true;return !!ctl('pen')}
function roleView(){
  const R=[['tir','🎯','Contrôleur de tir'],['pen','🏃','Contrôleur des pénalités'],['org','⚙️','Organisateur']];
  const S=['1','2','3','4','5','6','7','F'];
  let h='<h3>Série</h3><div class="seg">'+S.map(x=>'<button class="'+(x===serie?'on':'')+'" onclick="chSerie(\''+x+'\')">'+(x==='F'?'Finale':x)+'</button>').join('')+'</div>'+
    '<h3>Je suis…</h3><div class="role">'+R.map(r=>'<button class="'+(rs.role===r[0]?'on':'')+'" onclick="rsRole(\''+r[0]+'\')">'+r[1]+' '+r[2]+'</button>').join('')+'</div>'+
    '<h3>Mon nom <small style="font-weight:400">(obligatoire)</small></h3><input id="nm" class="'+(rs.err?'inerr':'')+'" value="'+esc(rs.name)+'" placeholder="Votre nom" autocomplete="off">';
  if(rs.role!=='org')h+='<p class="note">Saisissez votre nom tel qu’il a été enregistré par l’organisateur pour cette série. Votre poste s’ouvre automatiquement.</p>';
  if(rs.err)h+='<p class="err">⚠ '+esc(rs.err)+'</p>';
  return h+'<button class="btn" onclick="validRole()">Ouvrir</button>';
}
function roleErr(m){rs.err=m;render()}
function validRole(){
  keepNm();
  const nm=rs.name.trim(),n=norm(nm);
  if(!nm)return roleErr('Merci de saisir votre nom pour continuer.');
  let p=0,official=nm;
  if(rs.role!=='org'){
    if(!anyAssigned())return roleErr(DB&&status!=='ok'?'Synchronisation en cours… patientez quelques secondes puis réessayez.':'Aucun contrôleur n’est attribué pour cette série. Voyez l’organisateur.');
    const tp=[];for(let q=0;q<np();q++)if(norm(ctl('p'+q))===n)tp.push(q);
    const isPen=norm(ctl('pen'))===n;
    if(rs.role==='tir'){
      if(!tp.length)return roleErr(isPen?'Ce nom est attribué au contrôleur des pénalités : choisissez « Contrôleur des pénalités ».':'Nom non reconnu pour cette série. Vérifiez l’orthographe ou voyez l’organisateur.');
      p=tp[0];official=ctl('p'+p);
    }else{
      if(!isPen)return roleErr(tp.length?'Ce nom est attribué au poste '+(tp[0]+1)+' (tir) : choisissez « Contrôleur de tir ».':'Nom non reconnu pour cette série. Vérifiez l’orthographe ou voyez l’organisateur.');
      official=ctl('pen');
    }
  }
  me={role:rs.role,poste:p,name:official};
  ls.set('me',me);poste=p;showRole=false;tab=TABS[me.role][0][0];render();
}

/* ---------- Tir ---------- */
function pick(t,c){
  cur={t,c};const v=val(manche,t,c,'m'),col=C.find(x=>x[0]===c);
  let h='<h3>Équipe '+t+' · '+col[1]+' — cibles manquées</h3><div class="num">';
  for(let i=0;i<=5;i++)h+='<button class="'+(v===i?'cur':'')+'" onclick="choose('+i+')">'+i+'</button>';
  h+='<button class="sm" style="grid-column:span 2" onclick="choose(null)">Effacer</button><button class="sm" onclick="closeSheet()">Fermer</button></div>';
  $('#sheet>div').innerHTML=h;$('#sheet').classList.add('open');
}
function closeSheet(){$('#sheet').classList.remove('open');cur=null}
function choose(v){const k=key(manche,cur.t,cur.c,'m');closeSheet();set(k,v)}
function tir(){
  if(poste>=np())poste=np()-1;
  const mine=me&&me.role==='tir';
  let h;
  if(mine)h='<div class="note"><b>Poste '+(poste+1)+'</b> · équipes '+lab(poste)+(me.name?' · '+esc(me.name):'')+'</div>';
  else{h='<div class="seg">';for(let p=0;p<np();p++)h+='<button class="'+(p===poste?'on':'')+'" onclick="setPoste('+p+')">'+lab(p)+'</button>';h+='</div>'}
  h+='<div class="hdr"><span></span>'+C.map(c=>'<b style="background:'+c[2]+';color:'+c[3]+'">'+c[1]+'</b>').join('')+'</div>';
  const r=tr(poste);
  for(let t=r[0];t<=r[1];t++){
    h+='<div class="row"><span class="tn">'+t+'</span>'+C.map(c=>{
      const m=val(manche,t,c[0],'m');
      return '<button class="cell '+(m>0?'bad':'')+'" style="border-color:'+c[2]+'" onclick="pick('+t+',\''+c[0]+'\')">'+(m==null?'·':m)+'</button>';
    }).join('')+'</div>';
  }
  return h+'<p class="empty">Touchez une case pour saisir le nombre de cibles manquées (0 à 5).</p>';
}

/* ---------- Pénalités ---------- */
function tap(cc){
  if(!selT)return;
  const t=selT,k=key(manche,t,cc,'p'),prev=data[k]||0,x=val(manche,t,cc,'m')||0,col=C.find(z=>z[0]===cc)[1];
  selT=null;hist.push({k,prev});
  msg=(prev+1>x?'⚠ ':'✓ ')+'Éq. '+t+' · '+col+' : '+(prev+1)+' / '+x+(prev+1>x?' (tour en trop)':'');
  try{navigator.vibrate(40)}catch(e){}
  set(k,prev+1);
}
function selTeam(t){selT=selT===t?null:t;render()}
function undo(){const h=hist.pop();if(!h)return;msg='↩ Dernière saisie annulée';set(h.k,h.prev)}
function adj(t,c,d){const k=key(manche,t,c,'p');set(k,Math.max(0,(data[k]||0)+d))}
function pen(){
  let h='<div class="msg'+(msg.indexOf('⚠')===0?' w':'')+'"><span>'+(msg||'Touchez un numéro d’équipe, puis la couleur')+'</span>'+
    '<button onclick="undo()"'+(hist.length?'':' disabled')+'>Annuler</button></div><div class="pad">';
  for(let t=1;t<=nb();t++){
    let todo=0;C.forEach(c=>{todo+=Math.max(0,(val(manche,t,c[0],'m')||0)-(val(manche,t,c[0],'p')||0))});
    h+='<button class="'+(t===selT?'sel ':'')+(todo?'todo':'')+'" onclick="selTeam('+t+')">'+t+(todo?'<i>'+todo+'</i>':'')+'</button>';
  }
  h+='</div><div class="cols">'+C.map(c=>{
    const x=selT?(val(manche,selT,c[0],'m')||0):0,y=selT?(val(manche,selT,c[0],'p')||0):0;
    return '<button '+(selT?'':'disabled ')+'style="background:'+c[2]+';color:'+c[3]+'" onclick="tap(\''+c[0]+'\')">'+c[1]+(selT?'<br><span style="font-size:clamp(14px,5vw,22px)">'+y+' / '+x+'</span>':'')+'</button>';
  }).join('')+'</div>';
  const L=[];
  for(let t=1;t<=nb();t++)C.forEach(c=>{const m=val(manche,t,c[0],'m')||0,p=val(manche,t,c[0],'p')||0;if(m>0||p>0)L.push({t,c,m,p,r:m-p})});
  L.sort((a,b)=>((a.r===0)-(b.r===0))||a.t-b.t);
  h+='<h3>Suivi ('+MN[manche]+')</h3>';
  if(!L.length)return h+'<p class="empty">Aucun tour de pénalité à effectuer.</p>';
  return h+L.map(x=>{
    const cls=x.r<0?'err':x.r===0?'done':'';
    const txt=x.r>0?x.r+' tour'+(x.r>1?'s':'')+' à faire':x.r===0?'✓ terminé':'⚠ '+(-x.r)+' tour(s) en trop';
    return '<div class="pr '+cls+'"><span class="dot" style="background:'+x.c[2]+'"></span>'+
      '<div class="i"><b>Équipe '+x.t+' · '+x.c[1]+'</b><small>'+x.p+' / '+x.m+' faits · <span class="tag">'+txt+'</span></small></div>'+
      '<button class="u" onclick="adj('+x.t+',\''+x.c[0]+'\',-1)">−1</button></div>';
  }).join('');
}

/* ---------- Récap ---------- */
const plur=(n,w)=>n+' '+w+(n>1?'s':'');
function ecarts(){
  const L=[];
  ['ms','po'].forEach(m=>{for(let t=1;t<=nb();t++)C.forEach(c=>{
    const x=val(m,t,c[0],'m')||0,y=val(m,t,c[0],'p')||0;
    if(x!==y)L.push({m,t,c,x,y,d:x-y});
  })});
  return L;
}
function grid(){
  const hd=sep=>C.map((c,i)=>'<th'+(sep&&i===0?' class="sep"':'')+' style="background:'+c[2]+';color:'+c[3]+'">'+c[1][0]+'</th>').join('');
  let h='<div class="wrap"><table class="gt"><tr><th rowspan="2">Éq.</th><th colspan="4">Mass Start</th><th colspan="4" class="sep">Poursuite</th></tr><tr>'+hd(false)+hd(true)+'</tr>';
  for(let t=1;t<=nb();t++){
    h+='<tr><td><b>'+t+'</b></td>'+['ms','po'].map((m,mi)=>C.map((c,i)=>{
      const x=val(m,t,c[0],'m')||0,y=val(m,t,c[0],'p')||0;
      const cl=(x===0&&y===0?'':x===y?'ok':y<x?'miss':'extra')+(mi&&i===0?' sep':'');
      return '<td class="'+cl+'">'+(x===0&&y===0?'·':y+'/'+x)+'</td>';
    }).join('')).join('')+'</tr>';
  }
  return h+'</table></div>';
}
function rec(){
  const L=ecarts(),nm=L.filter(e=>e.d>0).length,ne=L.length-nm;
  let h='<p style="margin:0 0 8px"><b>'+(serie==='F'?'Finale':'Série '+serie)+'</b> · '+nb()+' équipes · '+
    (L.length?'<span class="bad">'+plur(nm,'concurrent')+' avec tour(s) non effectué(s)</span>'+(ne?' · '+plur(ne,'avec tour')+' en trop':''):'<span style="color:var(--ok);font-weight:700">Aucun écart</span>')+'</p>';
  h+=L.map(e=>'<div class="pr '+(e.d>0?'err':'')+'"><span class="dot" style="background:'+e.c[2]+'"></span><div class="i"><b>Éq. '+e.t+' · '+e.c[1]+'</b>'+
    '<small>'+MN[e.m]+' · '+e.x+' manqué'+(e.x>1?'s':'')+', '+e.y+' fait'+(e.y>1?'s':'')+'</small></div>'+
    '<span class="tag" style="color:'+(e.d>0?'var(--bad)':'#e08a00')+'">'+(e.d>0?plur(e.d,'tour')+'<br>non effectué'+(e.d>1?'s':''):plur(-e.d,'tour')+'<br>en trop')+'</span></div>').join('');
  h+='<h3>Tours faits / tirs manqués</h3>'+grid();
  return h+'<p class="note"><span class="bad">Rouge</span> = tours non effectués, orange = tours en trop, vert = conforme. R V J B = Rouge, Vert, Jaune, Bleu. À consulter une fois la manche terminée ; en cas de doute, le comité statue.</p>'+
    '<button class="btn" onclick="csv()">Exporter en CSV</button>';
}
function csv(){
  let s='Serie;Manche;Equipe;Couleur;Tirs_manques;Tours_dus;Tours_faits;Ecart(non_effectues)\n';
  ['ms','po'].forEach(m=>{for(let t=1;t<=nb();t++)C.forEach(c=>{
    const x=val(m,t,c[0],'m')||0,y=val(m,t,c[0],'p')||0;
    s+=[serie,MN[m],t,c[1],x,x,y,x-y].join(';')+'\n';
  })});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv'}));
  a.download='biathlon_serie_'+serie+'.csv';document.body.appendChild(a);a.click();a.remove();
}

/* ---------- Série (organisateur) ---------- */
function setNb(v){set('cfg/nb',Math.max(1,Math.min(60,parseInt(v)||20)))}
function cfgView(){
  let h='<h3>'+(serie==='F'?'Finale':'Série '+serie)+'</h3><div class="card"><b>Nombre d’équipes</b>'+
    '<div class="stp"><button onclick="setNb(nb()-1)">−</button><input type="number" min="1" max="60" value="'+nb()+'" onchange="setNb(this.value)"><button onclick="setNb(nb()+1)">+</button></div>'+
    '<p class="note">'+plur(np(),'contrôleur')+' de tir (tranches de 5 équipes). Tous les téléphones se mettent à jour automatiquement.</p></div>'+
    '<div class="card"><b>Contrôleurs de la série</b><p class="note">Saisissez le nom de chaque contrôleur. Il devra le saisir à l’identique sur son téléphone pour ouvrir son tableau.</p>';
  for(let p=0;p<np();p++)h+='<div class="crl2"><span>Poste '+(p+1)+' · éq. '+lab(p)+'</span><input value="'+esc(ctl('p'+p))+'" placeholder="Nom" autocomplete="off" onchange="setCtl(\'p'+p+'\',this.value)"></div>';
  h+='<div class="crl2"><span>Pénalités</span><input value="'+esc(ctl('pen'))+'" placeholder="Nom" autocomplete="off" onchange="setCtl(\'pen\',this.value)"></div><div id="dup"></div></div>'+
    '<button class="btn" style="background:var(--bad)" onclick="wipe(false)">Remise à zéro de la série</button>'+
    '<button class="btn" style="background:#6b1f1f" onclick="wipe(true)">Tout remettre à zéro (toutes les séries)</button>'+
    '<p class="note">La remise à zéro efface les tirs et les tours, pas le nombre d’équipes ni les noms.</p>';
  return h;
}
function setCtl(k,v){
  v=v.trim();const kk='ctrl/'+k;
  data[kk]=v||null;pending[kk]=1;persist();push(kk);dupInfo();
}
function dupInfo(){
  const el=$('#dup');if(!el)return;
  const ids=[];for(let p=0;p<np();p++)ids.push('p'+p);ids.push('pen');
  const seen={};let empty=0;
  ids.forEach(id=>{const n=norm(ctl(id));if(!n){empty++;return}(seen[n]=seen[n]||[]).push(id)});
  const nom=id=>id==='pen'?'pénalités':'poste '+(parseInt(id.slice(1))+1);
  const dups=Object.keys(seen).filter(n=>seen[n].length>1).map(n=>esc(ctl(seen[n][0]))+' ('+seen[n].map(nom).join(' et ')+')');
  el.innerHTML=(dups.length?'<p class="err">⚠ Même nom attribué deux fois : '+dups.join(' ; ')+'</p>':'')+
    (empty?'<p class="note">'+empty+' attribution'+(empty>1?'s':'')+' manquante'+(empty>1?'s':'')+'.</p>':'<p class="note">Tous les postes sont attribués.</p>');
}
async function wipe(all){
  const ser=all?['1','2','3','4','5','6','7','F']:[serie];
  if(!confirm(all?'Remettre à zéro TOUTES les séries (et la finale) ? Les tirs et tours seront supprimés sur tous les appareils.':'Remettre à zéro '+(serie==='F'?'la finale':'la série '+serie)+' ? Les tirs et tours seront supprimés sur tous les appareils.'))return;
  if(((prompt('Pour confirmer, tapez ZERO')||'').trim().toUpperCase())!=='ZERO')return;
  if(DB){
    try{const rs2=await Promise.all(ser.flatMap(s=>['ms','po'].map(m=>fetch(DB+'/s'+s+'/'+m+'.json',{method:'DELETE'}))));
        if(rs2.some(r=>!r.ok))throw 0}
    catch(e){alert('Réseau indisponible : rien n’a été effacé. Réessayez avec du réseau.');return}
  }
  const clean=o=>{const n={};for(const k in o)if(k.indexOf('ms/')!==0&&k.indexOf('po/')!==0)n[k]=o[k];return n};
  ser.forEach(s=>{ls.set('data_'+s,clean(s===serie?data:ls.get('data_'+s,{})));ls.set('pend_'+s,clean(s===serie?pending:ls.get('pend_'+s,{})))});
  data=ls.get('data_'+serie,{});pending=ls.get('pend_'+serie,{});hist=[];msg='';selT=null;render();
  alert('Remise à zéro effectuée.');
}

/* ---------- Affichage ---------- */
function render(){
  const tabs=showRole?[]:TABS[me.role];
  if(!showRole&&!tabs.some(x=>x[0]===tab))tab=tabs[0][0];
  $('#main').innerHTML=showRole?roleView():tab==='tir'?tir():tab==='pen'?pen():tab==='rec'?rec():cfgView();
  if(!showRole&&tab==='cfg')dupInfo();
  $('nav').innerHTML=tabs.map(x=>'<button class="'+(x[0]===tab?'on':'')+'" onclick="chTab(\''+x[0]+'\')">'+x[1]+'<br>'+x[2]+'</button>').join('');
  $('nav').style.display=showRole?'none':'flex';
  document.querySelector('.m').style.display=(showRole||tab==='rec'||tab==='cfg')?'none':'flex';
  $('#serie').style.display=showRole?'none':'';$('#me').style.display=showRole?'none':'';
  head();
}

$('#serie').innerHTML=['1','2','3','4','5','6','7'].map(s=>'<option value="'+s+'">Série '+s+'</option>').join('')+'<option value="F">Finale</option>';
$('#serie').value=serie;
render();pull();setInterval(pull,4000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
